<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>


  <nav class="navbar">
    <span class="brand">L&B's Sari-sari</span>
    <div class="nav-links">
      <a href="index.html">SKU Generator</a>
      <a href="receipt.html" class="active">Receipt Generator</a>
    </div>
  </nav>

<div id="main">
  <div class="card">

    <div class="card-header">
      <div class="icon">L&B's Sari-sari</div>
      <h1>Resibo</h1>
    </div>
    <div>
        <form id="order-form">

          <div class="field">
            <label for="customer">Customer Name</label>
            <input type="text" id="customer" placeholder="e.g. Juan Dela Cruz" maxlength="40">
          </div>

          <span class="section-title">Menu (tick an item, then set the quantity)</span>
          <div id="menu-list">

            <div class="menu-item">
              <label for="menu-keychains">
            <input id="menu-keychains" type="checkbox" name="menu-item" value="Ulam"> Ulam ₱250</label>
              <input id="menu-keychains-quantity" class="menu-quantity" type="number" min="1" step="1" value="1" label="Keychains quantity" disabled>
            </div>

            <div class="menu-item">
              <label for="menu-beverages">
            <input id="menu-beverages" type="checkbox" name="menu-item" value="Beverages"> Beverages ₱150</label>
              <input id="menu-beverages-quantity" class="menu-quantity" type="number" min="1" step="1" value="1" label="Beverages quantity" disabled>
            </div>

            <div class="menu-item">
              <label for="menu-snacks">
            <input id="menu-snacks" type="checkbox" name="menu-item" value="Snacks"> Snacks ₱150</label>
              <input id="menu-snacks-quantity" class="menu-quantity" type="number" min="1" step="1" value="1" label="Snacks quantity" disabled>
            </div>

            <div class="menu-item">
              <label for="menu-baggies">
            <input id="menu-baggies" type="checkbox" name="menu-item" value="Candy"> Candy ₱500</label>
              <input id="menu-baggies-quantity" class="menu-quantity" type="number" min="1" step="1" value="1" label="Baggies quantity" disabled>
            </div>

          </div>


          <div class="field">
            <label for="cash">Cash Received (₱)</label>
            <input type="number" id="cash" placeholder="e.g. 500" min="0" step="1">
          </div>

          <button type="button" class="btn" py-click="click">Create Order</button>
          <p class="error" id="order-error" role="alert"></p>
        </form>
        <br>
        <br>
        <div class="result receipt-result lekton-regular" id="output">Your order summary will appear here.</div>
      </div>
    </div>

    

  </div>
</div>
<py-script src="receipt.py"></py-script>
<script>
  document.querySelectorAll(".menu-item input[type='checkbox']").forEach((checkbox) => {
    checkbox.addEventListener("change", () => {
      const quantity = checkbox.closest(".menu-item").querySelector(".menu-quantity");
      quantity.disabled = !checkbox.checked;
    });
  });
</script>
</body>
</html>
